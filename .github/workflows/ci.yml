name: Continuous Integration

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'

permissions:
  contents: write
  packages: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: imagename
        uses: ASzc/change-string-case-action@v8
        with:
          string: ${{ github.repository }}

      - name: 📝 Get Current Version
        id: package-version
        run: echo "current-version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 🔐 Login to Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔧 Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.imagename.outputs.lowercase }}:${{ steps.package-version.outputs.current-version}}
            ${{ env.REGISTRY }}/${{ steps.imagename.outputs.lowercase }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🎫 Update patch version
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git pull --rebase origin main
          npm version prerelease --preid=rc                                                    
          for i in {1..3}; do                                                                  
            git pull --rebase origin main && git push origin main && break || sleep 3                                                                              
          done
