version: 2
# UN-46: weekly Dependabot for npm, Docker, and GitHub Actions.
# Note: Dependabot schema here rejects draft: true — bump PRs open ready-for-review.
# Enable Dependabot alerts/security updates in repo settings separately.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      production-npm:
        dependency-type: production
      development-npm:
        dependency-type: development

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
