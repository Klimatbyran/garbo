version: 2
# UN-46: weekly Dependabot for npm, Docker, and GitHub Actions.
# draft: true so bump PRs stay draft until marked ready (skips draft-gated CI).
# Enable Dependabot alerts/security updates in repo settings separately.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    draft: true
    groups:
      production-npm:
        dependency-type: production
      development-npm:
        dependency-type: development

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    draft: true

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    draft: true
    groups:
      github-actions:
        patterns:
          - "*"

